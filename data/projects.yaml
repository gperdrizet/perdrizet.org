# ============================================================
#  Project Registry
#
#  This file is the single source of truth for all projects.
#  It is partially auto-populated by tools/github-agent and
#  partially hand-authored (for non-GitHub items, live services,
#  etc.). The agent will NOT overwrite hand-authored fields.
#
#  Schema per project:
#    name:              slug (matches GitHub repo name where applicable)
#    display_name:      human-readable title
#    status:            live | published | wip | archived
#    tags:              list of technology/topic tags
#    roles:             roles this project demonstrates (used for job tailoring)
#                       values: llm-engineer, ml-engineer, data-scientist,
#                               educator, backend-engineer, researcher, devops
#    github:            full GitHub URL (omit if no repo)
#    service_url:       URL if deployed as a live service
#    package_url:       PyPI / DockerHub / npm URL if published
#    description_short: 1-2 sentence card summary (LLM-generated, editable)
#    description_long:  full project page content (LLM-generated, editable)
#    teaching_context:  optional — how this is used in teaching
#    highlights:        bullet points reused in resume tailoring
#    featured:          true to pin to top of Projects page
# ============================================================

projects:

