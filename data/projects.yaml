  - name: bug-hunter
    display_name: Bug Hunter
    status: live
    featured: true
    tags: [llm, python, education, web-app, fastapi, react]
    roles: [llm-engineer, educator]
    github: https://github.com/gperdrizet/bug-hunter
    service_url: https://bug-hunter.perdrizet.org
    description_short: >
      Educational tool for Python bug-fixing. Students are shown AI-generated
      broken snippets and must find and fix the bug in-browser using a Monaco editor
      with Pyodide-powered test execution.
    description_long: ""
    teaching_context: >
      Used as a hands-on practice tool in Python and data science bootcamp courses.
      Students can self-direct practice across topics (loops, functions, classes,
      file I/O, etc.) at three difficulty levels, freeing instructor time for
      higher-level concepts.
    highlights:
      - Built full-stack LLM-powered educational platform (FastAPI + React + PostgreSQL)
      - Designed few-shot prompting pipeline to generate syntactically valid, pedagogically useful bugs across 12 Python topics
      - Deployed as a closed-beta live service at bug-hunter.perdrizet.org with invite-code registration
      - Implemented CI/CD pipeline with GitHub Actions (staging + production environments on self-hosted VPS)

