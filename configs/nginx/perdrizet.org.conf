# perdrizet.org — Personal Website (Static Site)
# Serves the Astro-built static site from /opt/perdrizet.org/
# Deployed via GitHub Actions (rsync from CI → this directory)

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name perdrizet.org www.perdrizet.org;

    if ($host = perdrizet.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.perdrizet.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 301 https://perdrizet.org$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.perdrizet.org;

    ssl_certificate /etc/letsencrypt/live/perdrizet.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/perdrizet.org/privkey.pem; # managed by Certbot
    ssl_stapling off;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://perdrizet.org$request_uri;
}

# HTTPS — production site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name perdrizet.org;

    # SSL Configuration — Ionos Wildcard Certificate
    ssl_certificate /etc/letsencrypt/live/perdrizet.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/perdrizet.org/privkey.pem; # managed by Certbot
    ssl_stapling off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    include snippets/security-headers.conf;

    # Logging
    access_log /var/log/nginx/perdrizet.org-access.log;
    error_log /var/log/nginx/perdrizet.org-error.log;

    root /opt/perdrizet.org;
    index index.html;

    # Astro static site — clean URLs, SPA-style 404 fallback
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page (Astro generates this)
    error_page 404 /404.html;

    # Cache static assets aggressively (Astro fingerprints them)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache HTML (so deploys are reflected immediately)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Sitemap and robots — short cache
    location ~* \.(xml|txt)$ {
        expires 1h;
    }
}
