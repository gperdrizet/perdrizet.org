# perdrizet.org — Staging Environment (Static Site)
# Domain: site-staging.perdrizet.org
# Serves from /opt/perdrizet.org-staging/ — deployed on every push to main
# Protected by basic auth; accessible from internet (SSL) and tailnet

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name site-staging.perdrizet.org;

    if ($host = site-staging.perdrizet.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 301 https://$server_name$request_uri;
}

# HTTPS — staging site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name site-staging.perdrizet.org;

    # SSL Configuration — Ionos Wildcard Certificate
    ssl_certificate /etc/letsencrypt/live/perdrizet.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/perdrizet.org/privkey.pem; # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    include snippets/security-headers.conf;

    # Logging
    access_log /var/log/nginx/site-staging-access.log;
    error_log /var/log/nginx/site-staging-error.log;

    # Basic auth — required for all requests (uses shared .htpasswd)
    auth_basic "Staging — Authorized Access Only";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /opt/perdrizet.org-staging;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
