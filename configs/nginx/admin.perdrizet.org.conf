# Admin agent proxy
# Domain: admin.perdrizet.org → uvicorn on 127.0.0.1:8600
#
# Prerequisites:
#   certbot certonly --nginx -d admin.perdrizet.org
#   sudo systemctl enable --now perdrizet-admin  (see tools/admin/admin.service)

server {
    listen 80;
    listen [::]:80;
    server_name admin.perdrizet.org;
    include snippets/security-headers.conf;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.perdrizet.org;
    include snippets/security-headers.conf;

    ssl_certificate     /etc/letsencrypt/live/admin.perdrizet.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.perdrizet.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/admin-access.log;
    error_log  /var/log/nginx/admin-error.log;

    # Longer timeout for LLM inference
    proxy_read_timeout 120s;

    location / {
        proxy_pass         http://127.0.0.1:8600;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
    }
}
