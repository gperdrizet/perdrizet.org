name: Admin Agent Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  admin-check:
    name: Admin check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for admin changes
        id: changes
        run: |
          git fetch origin main --depth=1
          changed=$(git diff --name-only origin/main HEAD -- tools/admin/ .github/workflows/admin-test.yml)
          echo "changed=$changed"
          echo "has_changes=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.has_changes == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/admin/requirements.txt

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: pip install -r tools/admin/requirements.txt

      - name: Check imports
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: tools/admin
        run: python -c "import server; import editor"

      - name: Lint
        if: steps.changes.outputs.has_changes == 'true'
        run: pip install ruff && ruff check tools/admin/
