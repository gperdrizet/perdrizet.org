name: Deploy Admin Agent

on:
  push:
    branches: [main]
    paths:
      - "tools/admin/**"
      - ".github/workflows/admin-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-admin:
    name: Deploy admin agent
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GATEKEEPER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p ${{ secrets.GATEKEEPER_PORT }} "${{ secrets.GATEKEEPER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy admin agent code
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.GATEKEEPER_PORT }}" \
            tools/admin/ \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }}:/opt/perdrizet.org-admin/

      - name: Install dependencies
        run: |
          ssh -p ${{ secrets.GATEKEEPER_PORT }} \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }} \
            "/opt/perdrizet.org-admin/.venv/bin/pip install -q -r /opt/perdrizet.org-admin/requirements.txt"

      - name: Restart service
        run: |
          ssh -p ${{ secrets.GATEKEEPER_PORT }} \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }} \
            "sudo systemctl restart perdrizet-admin"

      - name: Health check
        run: |
          ssh -p ${{ secrets.GATEKEEPER_PORT }} \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }} \
            "sleep 3 && curl -sf http://127.0.0.1:8600/health -o /dev/null && echo 'Admin agent OK'"
