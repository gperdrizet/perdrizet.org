name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
      confirm:
        description: "Type 'deploy' to confirm"
        required: true

jobs:
  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.inputs.confirm == 'deploy' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GATEKEEPER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p ${{ secrets.GATEKEEPER_PORT }} "${{ secrets.GATEKEEPER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.GATEKEEPER_PORT }}" site/dist/ \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }}:/opt/perdrizet.org/

      - name: Health check
        run: |
          ssh -p ${{ secrets.GATEKEEPER_PORT }} \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }} \
            "curl -sf https://perdrizet.org/ -o /dev/null && echo 'Production OK'"

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ github.event.inputs.version }}" \
            -m "Release ${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"
