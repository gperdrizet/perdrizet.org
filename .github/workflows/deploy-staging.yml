name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GATEKEEPER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p ${{ secrets.GATEKEEPER_PORT }} "${{ secrets.GATEKEEPER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.GATEKEEPER_PORT }}" site/dist/ \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }}:/opt/perdrizet.org-staging/

      - name: Deploy admin agent code
        run: |
          rsync -avz --delete --exclude='.venv' --exclude='__pycache__' --exclude='.env' \
            -e "ssh -p ${{ secrets.GATEKEEPER_PORT }}" \
            tools/admin/ \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }}:/opt/perdrizet.org-admin/

      - name: Install admin dependencies
        run: |
          ssh -p ${{ secrets.GATEKEEPER_PORT }} \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }} \
            "python3 -m venv /opt/perdrizet.org-admin/.venv && \
             /opt/perdrizet.org-admin/.venv/bin/pip install -q -r /opt/perdrizet.org-admin/requirements.txt"

      - name: Health check
        run: |
          ssh -p ${{ secrets.GATEKEEPER_PORT }} \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }} \
            "curl -sf http://100.64.0.1:8008/ -o /dev/null && echo 'Staging OK' && \
             curl -sf http://127.0.0.1:8600/health -o /dev/null && echo 'Admin OK'"
