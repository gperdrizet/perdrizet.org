name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GATEKEEPER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.GATEKEEPER_PORT }} -H "${{ secrets.GATEKEEPER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.GATEKEEPER_PORT }}" site/dist/ \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }}:/opt/perdrizet.org-staging/

      - name: Health check
        run: |
          ssh -p ${{ secrets.GATEKEEPER_PORT }} \
            ${{ secrets.GATEKEEPER_USER }}@${{ secrets.GATEKEEPER_HOST }} \
            "curl -sf -H 'Host: site-staging.perdrizet.org' http://127.0.0.1/ -o /dev/null && echo 'Staging OK'"
