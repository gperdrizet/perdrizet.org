name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

  admin-check:
    name: Admin check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/admin/requirements.txt

      - name: Install admin dependencies
        run: pip install -r tools/admin/requirements.txt

      - name: Check admin imports
        working-directory: tools/admin
        run: python -c "import server; import editor"

      - name: Lint admin
        run: |
          pip install ruff
          ruff check tools/admin/
