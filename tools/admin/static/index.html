<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.875rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 0.95rem; font-weight: 600; color: #f1f5f9; letter-spacing: 0.01em; }
    header span { font-size: 0.75rem; color: #64748b; margin-left: 0.5rem; }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .btn-ghost {
      background: none;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.3rem 0.75rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.78rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-ghost:hover { border-color: #64748b; color: #e2e8f0; }
    .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .msg {
      max-width: 78%;
      padding: 0.7rem 1rem;
      border-radius: 0.75rem;
      line-height: 1.55;
      white-space: pre-wrap;
      font-size: 0.875rem;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #eff6ff;
      border-bottom-right-radius: 0.2rem;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1e293b;
      color: #cbd5e1;
      border-bottom-left-radius: 0.2rem;
    }
    .msg.system-note {
      align-self: center;
      background: transparent;
      color: #475569;
      font-size: 0.78rem;
      font-style: italic;
      max-width: 100%;
      text-align: center;
    }
    /* Green left border when a commit was made */
    .msg.committed { border-left: 3px solid #22c55e; padding-left: 0.825rem; }

    footer {
      padding: 0.875rem 1.25rem;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      gap: 0.625rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      border-radius: 0.5rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
      min-height: 2.625rem;
      max-height: 9rem;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    textarea:focus { outline: none; border-color: #3b82f6; }
    textarea::placeholder { color: #475569; }

    .send-btn {
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.625rem 1.1rem;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) { background: #2563eb; }
    .send-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 0.875rem;
      height: 0.875rem;
      border: 2px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Site Admin<span>content editor</span></h1>
  </div>
  <div class="header-actions">
    <button class="btn-ghost" id="clearBtn">Clear history</button>
  </div>
</header>

<div id="messages">
  <div class="msg system-note">Describe the change you want, e.g. "Set bug-hunter as featured" or "Update my tagline to..."</div>
</div>

<footer>
  <textarea id="input" placeholder="e.g. Update the description for nixx. Set llm-detector as featured." rows="1"></textarea>
  <button class="send-btn" id="sendBtn">Send</button>
</footer>

<script>
  const msgsEl    = document.getElementById('messages');
  const inputEl   = document.getElementById('input');
  const sendBtn   = document.getElementById('sendBtn');
  const clearBtn  = document.getElementById('clearBtn');

  // ── Chat ──────────────────────────────────────────────────────────────────

  function addMsg(text, role, committed = false) {
    const d = document.createElement('div');
    d.className = ['msg', role, committed ? 'committed' : ''].filter(Boolean).join(' ');
    d.textContent = text;
    msgsEl.appendChild(d);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return d;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    inputEl.value = '';
    inputEl.style.height = '';
    sendBtn.disabled = true;

    addMsg(text, 'user');

    const pending = document.createElement('div');
    pending.className = 'msg assistant';
    const spin = document.createElement('span');
    spin.className = 'spinner';
    pending.appendChild(spin);
    msgsEl.appendChild(pending);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      pending.textContent = data.reply;
      if (data.committed) pending.classList.add('committed');
    } catch (err) {
      pending.textContent = `Error: ${err.message}`;
      pending.style.color = '#f87171';
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = '';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 144) + 'px';
  });

  clearBtn.addEventListener('click', async () => {
    await fetch('/chat/history', { method: 'DELETE' });
    msgsEl.innerHTML = '<div class="msg system-note">History cleared.</div>';
  });
</script>
</body>
</html>
